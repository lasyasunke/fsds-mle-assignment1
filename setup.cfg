[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .pytest_cache
per-file-ignores =
    __init__.py:F401

[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = true
skip =
    .git,
    .venv,
    venv,
    build,
    dist

[tool:pytest]
addopts = -q
testpaths = tests
